<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SAT Question Bank</title>
<link href="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/theme/mermaid.min.css" rel="stylesheet" />
<style>
:root{color-scheme:dark}
html,body{margin:0;padding:0;background:#0b0b0e;min-height:100%}
#sat-app{
  --bg:#0b0b0e; --panel:#141418; --panel2:#1b1b21; --line:#2b2b33; --line2:#3a3a45;
  --tx:#f4f4f6; --dim:#a2a2ad; --dim2:#75757f;
  --cy:#22d3ee; --cy-d:#0e7490;
  --blue:#2f7fe8; --green:#22c55e; --orange:#f59e0b; --red:#ef4444;
  --gcard:#12331f; --gline:#22c55e; --rcard:#3d1416; --rline:#ef4444;
  --gbg:rgba(34,197,94,.14); --obg:rgba(245,158,11,.14); --rbg:rgba(239,68,68,.14);
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif;
  --r:10px;
  background:var(--bg); color:var(--tx); font-family:var(--sans); font-size:15px; line-height:1.6;
  height:100vh; overflow:hidden; display:flex; flex-direction:column;
}
#sat-app *{box-sizing:border-box}
#sat-app button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:var(--r);
  border:1px solid var(--line2);background:transparent;color:var(--tx);padding:7px 14px;
  transition:background .16s ease,border-color .16s ease,opacity .16s ease}
#sat-app button:hover:not(:disabled){background:var(--panel2);border-color:#4d4d5a}
#sat-app button:disabled{opacity:.4;cursor:not-allowed}
#sat-app button:focus-visible,#sat-app select:focus-visible,#sat-app input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#sat-app .btn-p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
#sat-app .btn-p:hover:not(:disabled){background:#1d5fc0;border-color:#1d5fc0}
#sat-app select,#sat-app input[type=text]{font-family:inherit;font-size:14px;background:var(--panel2);
  color:var(--tx);border:1px solid var(--line2);border-radius:var(--r);padding:7px 10px;min-height:36px}
#sat-app h1,#sat-app h2,#sat-app h3{font-weight:500;margin:0}
#sat-app .mono{font-variant-numeric:tabular-nums}
#sat-app .hide{display:none !important}
#sat-app>#view-home,#sat-app>#view-done{flex:1;min-height:0;overflow-y:auto}
#sat-app>#view-test{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#sat-app .top,#sat-app .bot{flex:0 0 auto}

#sat-app .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);min-height:58px}
#sat-app .top-l,#sat-app .top-r{display:flex;align-items:center;gap:8px}
#sat-app .top-r{justify-content:flex-end}
#sat-app .timer{font-size:21px;font-weight:500;text-align:center;letter-spacing:.5px;line-height:1.1}
#sat-app .timer-sub{display:flex;gap:6px;justify-content:center;margin-top:4px}
#sat-app .timer-sub button{padding:2px 11px;font-size:12px;min-height:0;border-radius:20px}
#sat-app .pill{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--dim)}
#sat-app .tool{padding:6px 12px;font-size:13px}
#sat-app .tool.on{background:var(--cy);border-color:var(--cy);color:#06333d;font-weight:500}
#sat-app .streak{display:flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:20px;overflow:hidden}
#sat-app .streak span{padding:4px 12px;font-size:13px;font-weight:500}
#sat-app .streak .s1{color:var(--orange)}
#sat-app .streak .s2{color:var(--cy);border-left:1px solid var(--line2)}

#sat-app .work{flex:1;min-height:0;display:flex;position:relative}
#sat-app .panes{display:flex;flex:1;min-height:0;align-items:stretch}
#sat-app .pane{padding:26px 30px;overflow-y:auto;min-height:0}
#sat-app .pane-l{flex:1 1 50%;min-width:0}
#sat-app .pane-r{flex:1 1 50%;min-width:0;border-left:1px solid var(--line)}
#sat-app .panes.solo{justify-content:center}
#sat-app .panes.solo .pane-l,#sat-app .panes.solo .grip{display:none !important}
#sat-app .panes.solo .pane-r{flex:0 1 760px;width:100%;max-width:760px;border-left:0;margin:0 auto}
#sat-app mark{cursor:pointer}
#sat-app mark:hover{outline:1.5px solid var(--orange)}
#sat-app .grip{width:11px;flex:0 0 11px;cursor:col-resize;display:flex;align-items:center;justify-content:center;user-select:none}
#sat-app .grip span{width:3px;height:26px;border-radius:3px;background:var(--line2)}
#sat-app .passage{font-family:var(--serif);font-size:17.5px;line-height:1.72}
#sat-app .passage p{margin:0 0 14px}
#sat-app .stem{font-family:var(--serif);font-size:17px;line-height:1.65;margin:16px 0 22px}
#sat-app .qhead{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
#sat-app .qnum{width:34px;height:34px;border-radius:7px;background:#fff;color:#000;display:flex;
  align-items:center;justify-content:center;font-weight:600;font-size:15px;flex:0 0 auto}
#sat-app .qhead .spacer{flex:1}

#sat-app .choices{display:flex;flex-direction:column;gap:13px}
#sat-app .crow{display:flex;align-items:center;gap:14px}
#sat-app .choice{flex:1;display:flex;align-items:flex-start;gap:14px;text-align:left;
  padding:16px 18px;border:1.5px solid var(--line2);border-radius:12px;background:transparent;
  color:var(--tx);font-family:var(--serif);font-size:16.5px;line-height:1.5;min-height:58px;position:relative}
#sat-app .choice:hover:not(:disabled){background:var(--panel2)}
#sat-app .badge{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:1.5px solid var(--dim2);
  display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:13.5px;
  font-weight:600;margin-top:1px}
#sat-app .ctext{flex:1;padding-top:2px}
#sat-app .choice.sel{border-color:var(--cy)}
#sat-app .choice.sel .badge{background:var(--cy);border-color:var(--cy);color:#06333d}
#sat-app .choice.ko{opacity:.4}
#sat-app .choice.ko .ctext{text-decoration:line-through}
#sat-app .choice.right{border-color:var(--gline);background:var(--gcard)}
#sat-app .choice.right .badge{background:var(--green);border-color:var(--green);color:#04250f;font-size:15px}
#sat-app .choice.wrong{border-color:var(--rline);background:var(--rcard)}
#sat-app .choice.wrong .badge{background:var(--red);border-color:var(--red);color:#fff;font-size:15px}
#sat-app .inline-act{margin-left:auto;align-self:center;flex:0 0 auto;border-radius:22px;
  padding:9px 22px;font-size:14.5px;font-weight:500}
#sat-app .inline-act.check{background:var(--cy);border-color:var(--cy);color:#06333d}
#sat-app .ko-btn{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1.5px solid var(--dim2);
  background:transparent;color:var(--dim);font-size:12.5px;font-weight:600;padding:0;display:flex;
  align-items:center;justify-content:center;position:relative}
#sat-app .ko-btn::after{content:"";position:absolute;left:4px;right:4px;height:1.5px;background:var(--dim);opacity:0}
#sat-app .ko-btn.on{border-color:var(--tx);color:var(--tx)}
#sat-app .ko-btn.on::after{opacity:1;background:var(--tx)}
#sat-app .gridin{width:100%;font-family:var(--serif);font-size:17px;padding:13px 15px}
#sat-app .gi-row{display:flex;gap:12px;align-items:center;margin-top:8px}

#sat-app .drawer{flex:0 0 0;width:0;border-left:1px solid var(--line);background:var(--panel);
  overflow:hidden;transition:flex-basis .18s ease,width .18s ease;display:flex;flex-direction:column}
#sat-app .drawer.open{flex:0 0 min(460px,46%);width:min(460px,46%)}
#sat-app .dr-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
#sat-app .dr-h .spacer{flex:1}
#sat-app .dr-b{padding:18px;overflow-y:auto;flex:1;min-height:0;font-size:14.5px;line-height:1.65}
#sat-app .ans-card{border:1px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:20px}
#sat-app .ans-card .lbl{font-size:12.5px;color:var(--dim);margin-bottom:9px}
#sat-app .ans-in{border:1.5px solid var(--gline);background:var(--gcard);border-radius:10px;
  padding:13px 15px;display:flex;gap:12px;align-items:flex-start;font-family:var(--serif);font-size:16px}
#sat-app .ans-in .badge{background:var(--green);border-color:var(--green);color:#04250f}
#sat-app .blk+.blk{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
#sat-app .blk h4{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim2)}
#sat-app .rule{border-left:3px solid var(--orange);padding-left:12px}
#sat-app .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
#sat-app .kv span:first-child{color:var(--dim)}

#sat-app .bot{display:flex;align-items:center;gap:9px;padding:11px 16px;
  border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#sat-app .bot .spacer{flex:1}
#sat-app .navbtn{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);
  border:1px solid var(--line2);padding:9px 16px;font-weight:500;border-radius:22px}
#sat-app .bot button{border-radius:22px;padding:9px 17px}

#sat-app .navmap{padding:16px;border-top:1px solid var(--line);background:var(--panel);
  flex:0 0 auto;max-height:34vh;overflow-y:auto}
#sat-app .navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;margin-top:12px}
#sat-app .navcell{height:40px;border-radius:8px;border:1.5px dashed var(--line2);background:transparent;
  color:var(--dim);font-size:13px;font-weight:500;padding:0;position:relative}
#sat-app .navcell.done{border-style:solid;border-color:var(--cy);background:rgba(34,211,238,.14);color:var(--tx)}
#sat-app .navcell.g{border-style:solid;border-color:var(--green);background:var(--gbg);color:#a7f3c4}
#sat-app .navcell.o{border-style:solid;border-color:var(--orange);background:var(--obg);color:#fcd9a0}
#sat-app .navcell.r{border-style:solid;border-color:var(--red);background:var(--rbg);color:#fca5a5}
#sat-app .navcell.cur{outline:2px solid var(--tx);outline-offset:2px}

#sat-app .home{padding:24px 26px}
#sat-app .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
#sat-app .tabs{display:flex;gap:6px;margin:18px 0 22px;border-bottom:1px solid var(--line)}
#sat-app .tab{border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 14px;color:var(--dim)}
#sat-app .tab:hover{background:transparent;color:var(--tx)}
#sat-app .tab.on{color:var(--tx);border-bottom-color:var(--cy)}
#sat-app .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
#sat-app .card{background:var(--panel);border-radius:12px;padding:13px 15px;border:1px solid var(--line)}
#sat-app .card .k{font-size:12px;color:var(--dim);margin-bottom:5px}
#sat-app .card .v{font-size:23px;font-weight:500}
#sat-app .fset{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
#sat-app .fset h3{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim2);margin-bottom:11px}
#sat-app .frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#sat-app .frow+.frow{margin-top:11px}
#sat-app .chip{padding:6px 12px;font-size:13px;border-radius:20px;border:1px solid var(--line2);color:var(--dim)}
#sat-app .chip.on{background:var(--cy);border-color:var(--cy);color:#06333d;font-weight:500}
#sat-app .lbl{font-size:13px;color:var(--dim);margin-right:2px}
#sat-app table.brk{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
#sat-app table.brk th{text-align:left;font-weight:500;color:var(--dim2);font-size:12px;
  text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
#sat-app table.brk td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
#sat-app .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

#sat-app .note{font-size:13px;color:var(--dim2);line-height:1.6}
#sat-app .err{background:var(--rbg);border:1px solid var(--red);border-radius:10px;
  padding:11px 14px;font-size:13.5px;color:#fca5a5;margin-top:12px}
#sat-app mark{background:#fde68a;color:#231a00;border-radius:2px;padding:0 1px}
#sat-app .frac{display:inline-flex;flex-direction:column;vertical-align:-.55em;text-align:center;
  font-size:.86em;line-height:1.15;margin:0 .18em}
#sat-app .frac .num{border-bottom:1.2px solid currentColor;padding:0 .28em}
#sat-app .frac .den{padding:0 .28em}

#sat-app .cb figure.image,#sat-app .cb svg{max-width:100%}
#sat-app .cb figure.image{background:#fff;color:#000;border-radius:10px;padding:14px;
  margin:14px 0;display:inline-block;overflow-x:auto}
#sat-app .cb svg{height:auto}
#sat-app .cb img{max-width:100%;height:auto;background:#fff;border-radius:10px;padding:8px}
#sat-app .cb table{border-collapse:collapse;margin:16px 0;background:#fff;color:#000;
  border-radius:8px;overflow:hidden;font-family:var(--sans);font-size:15px}
#sat-app .cb table th,#sat-app .cb table td{border:1px solid #444;padding:8px 16px;text-align:center}
#sat-app .cb table th{font-weight:600;background:#ececf0}
#sat-app .cb p{margin:0 0 12px}
#sat-app .cb p:last-child{margin-bottom:0}
#sat-app .qual{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:600;letter-spacing:.03em}
#sat-app .qual.placeholder{background:var(--rbg);color:#fca5a5;border:1px solid var(--red)}
#sat-app .qual.missing_figure{background:var(--obg);color:#fcd9a0;border:1px solid var(--orange)}
#sat-app .qual.no_explanation{background:rgba(160,160,175,.15);color:var(--dim)}
#sat-app .warn{background:var(--obg);border:1px solid var(--orange);border-radius:10px;
  padding:10px 13px;font-size:13px;color:#fcd9a0;margin:12px 0}

/* Browse tab: reuses gridjs for a sortable/filterable table over the same
   embedded question set (was the separate "Sat Mistake Bank" artifact). */
#sat-app #browse-wrap{background:#fff;border-radius:8px;overflow:hidden;margin-top:14px}
#sat-app .gridjs-search-input{border-radius:6px !important}
#sat-app .gridjs-table{font-size:13px}
#sat-app .gridjs-th{background:#fafafa !important;font-size:11px !important;text-transform:uppercase;letter-spacing:.03em;color:#666 !important}
#sat-app .row-link{color:#2563eb;cursor:pointer;text-decoration:underline}
#sat-app .diff-Hard{background:#fde2e2;color:#a11616;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
#sat-app .diff-Medium{background:#fdf1d6;color:#8a5a00;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
#sat-app .diff-Easy{background:#dff5e1;color:#1a7431;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
#sat-app #browse-detail{display:none;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
#sat-app #browse-detail.open{display:block}
#sat-app #browse-detail .close{float:right;cursor:pointer;color:var(--dim)}
#sat-app .bchoice{padding:8px 10px;border:1px solid var(--line2);border-radius:6px;margin-bottom:6px;font-size:13px}
#sat-app .bchoice.correct{background:var(--gcard);border-color:var(--gline)}

@media (prefers-reduced-motion:reduce){#sat-app *{animation-duration:.01ms !important;transition-duration:.01ms !important}}
@media (max-width:820px){
  #sat-app .panes{flex-direction:column}
  #sat-app .pane-r{border-left:0;border-top:1px solid var(--line)}
  #sat-app .grip{display:none}
  #sat-app .pane{padding:18px}
  #sat-app .drawer.open{flex:0 0 100%;width:100%;position:absolute;inset:0;z-index:50}
  #sat-app .top{grid-template-columns:1fr}
  #sat-app .top-r{justify-content:flex-start}
}
</style>
</head>
<body>
<div id="sat-app" role="application" aria-label="SAT question bank">
  <div id="view-home" class="home">
    <div class="brand">
      <h1 style="font-size:22px">SAT question bank</h1>
      <span class="pill" id="src-pill">Loading&hellip;</span>
      <button id="btn-refresh" style="padding:3px 12px;font-size:12px">Refresh</button>
    </div>
    <p class="note">Mistakes + new College Board set. Drill OnePrep-style, or browse everything in a sortable table.</p>
    <div class="tabs">
      <button class="tab on" data-tab="drill">Drill</button>
      <button class="tab" data-tab="browse">Browse</button>
      <button class="tab" data-tab="stats">Progress</button>
    </div>
    <div id="tab-drill"></div>
    <div id="tab-browse" class="hide"></div>
    <div id="tab-stats" class="hide"></div>
  </div>

  <div id="view-test" class="hide">
    <div class="top">
      <div class="top-l">
        <button id="btn-quit">Go back</button>
        <span class="pill" id="t-sec">-</span>
      </div>
      <div>
        <div class="timer mono" id="t-clock">00:00</div>
        <div class="timer-sub">
          <button id="btn-pause">Pause</button>
          <button id="btn-hide">Hide</button>
        </div>
      </div>
      <div class="top-r">
        <button class="tool" id="btn-hl" aria-pressed="false">Highlight</button>
        <span class="streak"><span class="s1 mono" id="t-streak">0</span><span class="s2 mono" id="t-score">0 / 0</span></span>
      </div>
    </div>
    <div class="work">
      <div class="panes" id="panes">
        <div class="pane pane-l" id="pane-l"></div>
        <div class="grip" id="grip" role="separator" aria-label="Resize panes"><span></span></div>
        <div class="pane pane-r" id="pane-r"></div>
      </div>
      <aside class="drawer" id="drawer" aria-label="Explanation panel">
        <div class="dr-h"><strong style="font-weight:500">Explanation</strong>
          <span class="spacer"></span><button id="dr-close" aria-label="Close explanation">Close</button></div>
        <div class="dr-b" id="dr-body"></div>
      </aside>
    </div>
    <div id="navmap" class="navmap hide"></div>
    <div class="bot">
      <button id="btn-map" class="navbtn"><span id="map-lbl">1 of 1</span></button>
      <span class="spacer"></span>
      <button id="btn-exp">Explanation</button>
      <button id="btn-prev">Previous</button>
      <button id="btn-next" class="btn-p">Next</button>
    </div>
  </div>

  <div id="view-done" class="home hide"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/gridjs.umd.js" integrity="sha384-/XXDzxe4FsGiAe50i/u9pY/Vy/uX654MHB1xoc1BJNnH1WXHhqHga9g3q5tF4gj7" crossorigin="anonymous"></script>
<script>
(function(){
"use strict";
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LS={
  get(k,d){try{const v=localStorage.getItem('satd1_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('satd1_'+k,JSON.stringify(v))}catch(e){}}
};

let QS=[], PROG={}, LOADERR='';
let F=LS.get('filters',{label:'mistake',sec:'all',dom:'all',diff:'all',quality:'exclude_broken',order:'shuffle',limit:0});
if(F.dom===undefined) F.dom='all';
let BF=LS.get('browse_filters',{sec:'',dom:'',skl:'',diff:''});
let S=null, TAB='drill', DRAWER=false, HL=false, browseGrid=null;

/* ---------- LaTeX-lite, only for stored Notion mistake bodies ---------- */
function tex(s){
  let t=String(s);
  for(let i=0;i<6;i++){
    const n=t.replace(/\\d?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,
      (m,a,b)=>'<span class="frac"><span class="num">'+a+'</span><span class="den">'+b+'</span></span>');
    if(n===t) break; t=n;
  }
  return t.replace(/\\sqrt\s*\{([^{}]*)\}/g,'&radic;<span style="border-top:1.2px solid currentColor;padding:0 .15em">$1</span>')
     .replace(/\^\s*\{([^{}]*)\}/g,'<sup>$1</sup>').replace(/\^(-?\w)/g,'<sup>$1</sup>')
     .replace(/_\s*\{([^{}]*)\}/g,'<sub>$1</sub>').replace(/_(\w)/g,'<sub>$1</sub>')
     .replace(/\\(times)/g,'&times;').replace(/\\(cdot)/g,'&middot;').replace(/\\(div)/g,'&divide;')
     .replace(/\\(neq)/g,'&ne;').replace(/\\(leq|le)\b/g,'&le;').replace(/\\(geq|ge)\b/g,'&ge;')
     .replace(/\\(approx)/g,'&asymp;').replace(/\\(pm)/g,'&plusmn;').replace(/\\(pi)\b/g,'&pi;')
     .replace(/\\(theta)\b/g,'&theta;').replace(/\\(alpha)\b/g,'&alpha;').replace(/\\(beta)\b/g,'&beta;')
     .replace(/\\(infty)/g,'&infin;').replace(/\\(circ)/g,'&deg;').replace(/\\(text|mathrm)\s*\{([^{}]*)\}/g,'$2')
     .replace(/\\(left|right|!|,|;)/g,'').replace(/[{}]/g,'');
}

/* Stored HTML comes from the CB question-bank API and the user's own Notion
   pages. Strip script/style/handlers anyway, then resolve \( \) spans. */
function renderHTML(host,html,mode){
  const doc=new DOMParser().parseFromString('<div id="r">'+(html||'')+'</div>','text/html');
  const root=doc.getElementById('r');
  root.querySelectorAll('script,style,iframe,object,embed,link').forEach(n=>n.remove());
  root.querySelectorAll('*').forEach(n=>{
    [...n.attributes].forEach(a=>{
      const v=String(a.value||'');
      if(/^on/i.test(a.name)) n.removeAttribute(a.name);
      else if((a.name==='href'||a.name==='src')&&/^\s*javascript:/i.test(v)) n.removeAttribute(a.name);
    });
  });
  host.innerHTML='';
  [...root.childNodes].forEach(n=>host.appendChild(document.importNode(n,true)));
  if(mode==='latex_html'){
    host.innerHTML=host.innerHTML.replace(/\\\(([\s\S]*?)\\\)/g,(m,x)=>tex(x))
                                 .replace(/\\\[([\s\S]*?)\\\]/g,(m,x)=>'<div style="margin:10px 0">'+tex(x)+'</div>');
  }
  host.querySelectorAll('svg').forEach(s=>{
    if(!s.getAttribute('viewBox')&&s.getAttribute('width')&&s.getAttribute('height'))
      s.setAttribute('viewBox','0 0 '+parseFloat(s.getAttribute('width'))+' '+parseFloat(s.getAttribute('height')));
    s.removeAttribute('width'); s.style.maxWidth='100%';
  });
  host.querySelectorAll('table').forEach(t=>{
    if(!t.closest('figure')){const f=document.createElement('figure');f.className='image';
      t.parentNode.insertBefore(f,t);f.appendChild(t);}
  });
}

/* ---------- load (live from D1 via the local server's /api proxy) ---------- */
async function load(){
  $('src-pill').innerHTML='Loading from D1&hellip;';
  try{
    const [qRes,pRes]=await Promise.all([fetch('/api/questions'),fetch('/api/progress')]);
    if(!qRes.ok) throw new Error('questions fetch failed: HTTP '+qRes.status);
    QS=await qRes.json();
    const progRows=pRes.ok?await pRes.json():[];
    PROG={}; progRows.forEach(r=>PROG[r.question_id]=r);
    QS.forEach(q=>{ try{q.choices=JSON.parse(q.choices_json||'[]')}catch(e){q.choices=[]}
                    try{q.answer=(JSON.parse(q.correct_answer||'[]')||[]).join(', ')}catch(e){q.answer=q.correct_answer||''} });
    $('src-pill').textContent=QS.length+' questions · live from D1';
  }catch(e){ LOADERR=e.message||String(e); $('src-pill').textContent='D1 unavailable'; }
  drawHome();
  drawBrowse();
}

/* ---------- filtering (Drill tab) ---------- */
function domainsFor(sec){
  const s=new Set(QS.filter(q=>sec==='all'||q.section===sec).map(q=>q.domain).filter(Boolean));
  return [...s].sort();
}
function pool(){
  let a=QS.filter(q=>F.label==='all'||q.label===F.label);
  if(F.sec!=='all') a=a.filter(q=>q.section===F.sec);
  if(F.dom&&F.dom!=='all') a=a.filter(q=>q.domain===F.dom);
  if(F.diff!=='all') a=a.filter(q=>(q.difficulty||'').toLowerCase()===F.diff.toLowerCase());
  if(F.quality==='exclude_broken') a=a.filter(q=>q.content_quality==='ok');
  else if(F.quality==='only_broken') a=a.filter(q=>q.content_quality!=='ok');
  if(F.order==='shuffle'){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}
  if(F.limit>0) a=a.slice(0,F.limit);
  return a;
}

function chips(name,opts,cur){
  return opts.map(o=>`<button class="chip${(Array.isArray(cur)?cur.includes(o[0]):cur===o[0])?' on':''}" data-f="${name}" data-v="${esc(o[0])}">${esc(o[1])}</button>`).join('');
}

function drawStats(){
  const s=$('tab-stats'); const rows={};
  QS.forEach(q=>{const k=q.skill||q.domain||'—';(rows[k]=rows[k]||{n:0,a:0,c:0}).n++;
    const p=PROG[q.id]; if(p){rows[k].a+=p.attempts||0;rows[k].c+=p.corrects||0}});
  const ord=Object.entries(rows).sort((a,b)=>b[1].n-a[1].n);
  s.innerHTML=`<table class="brk"><thead><tr><th>Skill</th><th style="width:70px">In bank</th><th style="width:70px">Tried</th><th style="width:90px">Accuracy</th></tr></thead><tbody>
  ${ord.map(([k,v])=>{const acc=v.a?Math.round(v.c/v.a*100):null;
    return `<tr><td title="${esc(k)}">${esc(k)}</td><td class="mono">${v.n}</td><td class="mono">${v.a||'—'}</td>
    <td class="mono">${acc==null?'—':`<span class="dot" style="background:${acc>=80?'var(--green)':acc>=50?'var(--orange)':'var(--red)'}"></span>${acc}%`}</td></tr>`}).join('')}
  </tbody></table>`;
}

function browsePool(){

    (!BF.diff || q.difficulty===BF.diff));
}
function uniqueSorted(rows,key){ return [...new Set(rows.map(r=>r[key]).filter(Boolean))].sort(); }
function populateSelect(id,values,cur){
  const el=$(id);
  el.innerHTML='<option value="">All</option>'+values.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');

function difficultyBadge(d){ return `<span class="diff-${esc(d||'')}">${esc(d||'—')}</span>`; }

/* ---------- test (Drill tab) ---------- */
function start(){
  const items=pool(); if(!items.length) return;
  S={items,i:0,ans:{},ko:{},checked:{},streak:0,right:0,done:0,t0:Date.now()};
  $('view-home').classList.add('hide'); $('view-test').classList.remove('hide');
  tick(); render();
}
let timer=null,paused=false;
function tick(){ clearInterval(timer); timer=setInterval(()=>{
  if(paused||!S) return; const s=Math.floor((Date.now()-S.t0)/1000);
  $('t-clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
},250); }

function render(){
  const q=S.items[S.i]; if(!q) return;
  $('t-sec').textContent=(q.section||'')+(q.difficulty?' · '+q.difficulty:'');
  $('t-score').textContent=S.right+' / '+S.done;
  $('t-streak').textContent=S.streak;
  $('map-lbl').textContent=(S.i+1)+' of '+S.items.length;

  const split=splitStem(q);
  const hasPassage=!!split.passage;
  const L=$('pane-l'), R=$('pane-r'), panes=$('panes');
  panes.classList.toggle('solo',!hasPassage);

  if(hasPassage){ L.innerHTML='<div class="passage cb"></div>'; renderHTML(L.firstChild,split.passage,q.render_mode); }
  else L.innerHTML='';

  const warn=q.content_quality==='ok'?'':
    `<div class="warn"><b>Incomplete source.</b> ${
      q.content_quality==='placeholder'?'This row was reconstructed from a log; the choices are placeholders, not the real ones.':
      q.content_quality==='missing_figure'?'The original figure or table was never captured, so the question may not be answerable as shown.':
      'No explanation was captured for this question.'}</div>`;

  R.innerHTML=`<div class="qhead"><div class="qnum">${S.i+1}</div>
      <span class="pill">${esc(q.skill||q.domain||'')}</span><span class="spacer"></span>
      ${q.content_quality!=='ok'?`<span class="qual ${q.content_quality}">${q.content_quality.replace('_',' ')}</span>`:''}
      <span class="pill">${q.label==='mistake'?'mistake':'new'}</span></div>
    ${warn}
    <div class="stem cb" id="stem"></div>
    <div class="choices" id="choices"></div>`;

  renderHTML($('stem'),split.prompt,q.render_mode);
  drawChoices(q);
}

function splitStem(q){
  const h=String(q.stem_html||'');
  const m=h.match(/<h3>\s*(question|prompt)\s*<\/h3>/i);
  if(m){
    const passage=h.slice(0,m.index).replace(/<h3>\s*passage\s*<\/h3>/i,'');
    return {passage:passage.trim(),prompt:h.slice(m.index+m[0].length)};
  }
  if(q.section==='Reading & Writing'){
    const lp=h.match(/<p\b[^>]*>(?:(?!<\/p>)[\s\S])*<\/p>\s*$/i);
    if(lp){
      const txt=lp[0].replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim();
      if(/\?$/.test(txt)||/which choice|which finding|which quotation|most logical|the student wants|blank/i.test(txt))
        return {passage:h.slice(0,lp.index).trim(),prompt:lp[0]};
    }
    return {passage:h,prompt:''};
  }
  return {passage:'',prompt:h};
}

function drawChoices(q){
  const box=$('choices'), picked=S.ans[q.id], checked=S.checked[q.id];
  box.innerHTML='';
  if(q.qtype==='spr'||!q.choices.length){
    const wrap=document.createElement('div');
    wrap.innerHTML=`<input class="gridin" id="gi" type="text" placeholder="Type your answer" value="${esc(picked||'')}" ${checked?'disabled':''}>
      <div class="gi-row">${checked?`<span class="pill">Answer: ${esc(q.answer)}</span>`:'<button class="inline-act check" id="gi-check">Check</button>'}</div>`;
    box.appendChild(wrap);
    if(!checked) $('gi-check').onclick=()=>{S.ans[q.id]=$('gi').value.trim();grade(q);};
    return;
  }
  q.choices.forEach((c,idx)=>{
    const letter=c.letter||String.fromCharCode(65+idx);
    const row=document.createElement('div'); row.className='crow';
    const btn=document.createElement('button'); btn.className='choice'; btn.type='button';
    btn.innerHTML=`<span class="badge">${esc(letter)}</span><span class="ctext cb"></span>`;
    renderHTML(btn.querySelector('.ctext'),c.content,q.render_mode);
    if(picked===letter) btn.classList.add('sel');
    if(S.ko[q.id+letter]) btn.classList.add('ko');
    if(checked){
      const ok=isRight(q,letter);
      if(ok) btn.classList.add('right');
      else if(picked===letter) btn.classList.add('wrong');
      btn.disabled=true;
    } else btn.onclick=()=>{S.ans[q.id]=letter;drawChoices(q)};
    const ko=document.createElement('button'); ko.className='ko-btn'+(S.ko[q.id+letter]?' on':'');
    ko.textContent=letter; ko.title='Eliminate';
    ko.onclick=()=>{S.ko[q.id+letter]=!S.ko[q.id+letter];drawChoices(q)};
    row.appendChild(btn); row.appendChild(ko); box.appendChild(row);
  });
  if(!checked && S.ans[q.id]){
    const b=document.createElement('button'); b.className='inline-act check'; b.textContent='Check';
    b.style.marginTop='14px'; b.onclick=()=>grade(q); box.appendChild(b);
  }
}

function correctLetters(q){
  const m=String(q.answer||'').trim().match(/^([A-D])(?:\s*[,&/]\s*([A-D]))?(?=$|[\s,—–-])/i);
  return m?[m[1],m[2]].filter(Boolean).map(s=>s.toUpperCase()):[];
}
function isRight(q,letter){ return correctLetters(q).includes(String(letter).toUpperCase()); }
function grade(q){
  S.checked[q.id]=true; S.done++;
  const v=S.ans[q.id]||'';
  const ok=q.qtype==='spr'||!q.choices.length
    ? String(q.answer||'').replace(/\s|\(.*\)/g,'').split('—')[0].includes(v.replace(/\s/g,''))&&v!==''
    : isRight(q,v);
  if(ok){S.right++;S.streak++}else{S.streak=0}
  save(q.id,ok);
  drawChoices(q); render2();
  if(!ok) openDrawer();
}
function render2(){ $('t-score').textContent=S.right+' / '+S.done; $('t-streak').textContent=S.streak; }

/* Writes attempts back to the D1 progress table through the local server. */
async function save(id,ok){
  const p=PROG[id]||{attempts:0,corrects:0};
  p.attempts=(p.attempts||0)+1; p.corrects=(p.corrects||0)+(ok?1:0);
  p.marker=p.corrects/p.attempts>=.8?'Green':p.corrects/p.attempts>=.5?'Orange':'Red';
  p.last_reviewed=new Date().toISOString().slice(0,10);
  p.question_id=id;
  PROG[id]=p;
  try{ await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}); }catch(e){}
}

function openDrawer(){
  const q=S.items[S.i];
  DRAWER=true; $('drawer').classList.add('open');
  const b=$('dr-body');
  b.innerHTML=`<div class="ans-card"><div class="lbl">Correct answer</div>
      <div class="ans-in"><span class="badge">${esc((q.answer||'?').trim().charAt(0))}</span><span class="cb" id="ansv"></span></div></div>
    <div class="blk"><h4>Explanation</h4><div class="cb" id="expl"></div></div>
    ${q.rule?`<div class="blk"><h4>Rule</h4><div class="rule">${esc(q.rule)}</div></div>`:''}
    <div class="blk"><h4>Info</h4>
      <div class="kv"><span>Bank</span><span>${esc(q.label)}</span></div>
      <div class="kv"><span>Source</span><span>${esc(q.source||'—')}</span></div>
      <div class="kv"><span>Skill</span><span>${esc(q.skill||'—')}</span></div>
      <div class="kv"><span>Quality</span><span>${esc(q.content_quality)}</span></div>
      ${q.why_missed?`<div class="kv"><span>Why missed</span><span>${esc(q.why_missed)}</span></div>`:''}
      ${q.external_id?`<div class="kv"><span>External id</span><span class="mono">${esc(q.external_id)}</span></div>`:''}
    </div>`;
  $('ansv').textContent=q.answer||'';
  renderHTML($('expl'),q.rationale_html||'<p>No explanation stored for this question.</p>',q.render_mode);
}

$('btn-map').onclick=()=>{ const m=$('navmap'); m.classList.toggle('hide');
  if(!m.classList.contains('hide')) drawMap(); };
$('btn-hl').onclick=()=>{HL=!HL;$('btn-hl').classList.toggle('on',HL);$('btn-hl').setAttribute('aria-pressed',HL)};
document.addEventListener('mouseup',()=>{ if(!HL) return;
  const s=window.getSelection(); if(!s||s.isCollapsed) return;
  const r=s.getRangeAt(0);
  const host=[$('pane-l'),$('pane-r')].find(p=>p&&p.contains(r.commonAncestorContainer));
  if(!host) return;
  try{const m=document.createElement('mark');r.surroundContents(m);s.removeAllRanges()}catch(e){}
});
document.addEventListener('click',e=>{
  const m=e.target.closest&&e.target.closest('mark');
  if(!m) return;
  e.preventDefault(); e.stopPropagation();
  const p=m.parentNode;
  while(m.firstChild) p.insertBefore(m.firstChild,m);
  p.removeChild(m); p.normalize();
},true);
function drawMap(){
  const m=$('navmap');
  m.innerHTML='<div class="note">Jump to a question</div><div class="navgrid">'+
    S.items.map((q,i)=>{const p=PROG[q.id]; const cl=S.checked[q.id]?'done':'';
      const mk=p&&p.marker==='Green'?'g':p&&p.marker==='Orange'?'o':p&&p.marker==='Red'?'r':'';
      return `<button class="navcell ${cl} ${mk} ${i===S.i?'cur':''}" data-i="${i}">${i+1}</button>`}).join('')+'</div>';
  m.querySelectorAll('.navcell').forEach(b=>b.onclick=()=>{S.i=+b.dataset.i;m.classList.add('hide');render()});
}
function finish(){
  clearInterval(timer);
  const acc=S.done?Math.round(S.right/S.done*100):0;
  $('view-test').classList.add('hide'); $('view-done').classList.remove('hide');
  $('view-done').innerHTML=`<div class="brand"><h1 style="font-size:22px">Set complete</h1></div>
    <div class="cards" style="margin-top:16px">
      <div class="card"><div class="k">Answered</div><div class="v mono">${S.done}</div></div>
      <div class="card"><div class="k">Correct</div><div class="v mono" style="color:var(--green)">${S.right}</div></div>
      <div class="card"><div class="k">Accuracy</div><div class="v mono">${acc}%</div></div>
    </div>
    <div class="frow" style="margin-top:20px"><button class="btn-p" id="again">Back to bank</button></div>`;
  $('again').onclick=()=>$('btn-quit').click();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  TAB=b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  $('tab-drill').classList.toggle('hide',TAB!=='drill');
  $('tab-browse').classList.toggle('hide',TAB!=='browse');
  $('tab-stats').classList.toggle('hide',TAB!=='stats');
});
(function grip(){
  const g=$('grip'); let on=false;
  g.onmousedown=e=>{on=true;e.preventDefault()};
  document.addEventListener('mousemove',e=>{ if(!on) return;
    const p=$('panes'), r=p.getBoundingClientRect();
    const pct=Math.min(78,Math.max(22,(e.clientX-r.left)/r.width*100));
    $('pane-l').style.flex='0 0 '+pct+'%'; $('pane-r').style.flex='1 1 auto'; });
  document.addEventListener('mouseup',()=>on=false);
})();

$('btn-refresh').onclick=load;
load();
})();
</script>
</body>
</html>
