<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Question Bank — Official College Board</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --bg2: #f3f4f6;
  --panel: #ffffff;
  --border: #e5e7eb;
  --border2: #d1d5db;
  --text: #111827;
  --dim: #6b7280;
  --dim2: #9ca3af;
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --blue-bg: #eff6ff;
  --green: #16a34a;
  --green-bg: #f0fdf4;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --orange: #ea580c;
  --orange-bg: #fff7ed;
  --sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1115;
  --bg2: #22262e;
  --panel: #181b21;
  --border: #2a2e37;
  --border2: #3a3f4b;
  --text: #e5e7eb;
  --dim: #9ca3af;
  --dim2: #6b7280;
  --blue: #3b82f6;
  --blue-dark: #60a5fa;
  --blue-bg: #1e3a5f;
  --green: #22c55e;
  --green-bg: #14291c;
  --red: #f87171;
  --red-bg: #3a1a1a;
  --orange: #fb923c;
  --orange-bg: #3a2712;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }
button { font-family: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 8px 14px; transition: background .12s, border-color .12s, box-shadow .12s; }
button:hover:not(:disabled) { background: var(--bg2); border-color: var(--border2); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.btn-p { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.btn-p:hover:not(:disabled) { background: var(--blue-dark); border-color: var(--blue-dark); }
.hide { display: none !important; }
.mono { font-variant-numeric: tabular-nums; }
img { max-width: 100%; height: auto; }

/* ---------- HOME ---------- */
#view-home { height: 100vh; overflow-y: auto; }
.home-wrap { max-width: 1060px; margin: 0 auto; padding: 32px 24px 64px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-dot { width: 34px; height: 34px; border-radius: 10px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; }
.theme-toggle { width: 36px; height: 36px; padding: 0; border-radius: 9px; font-size: 16px; }
.brand h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
.brand .sub { font-size: 12.5px; color: var(--dim); margin-top: 1px; }
.tabs { display: flex; gap: 4px; background: var(--bg2); padding: 4px; border-radius: 10px; width: fit-content; margin: 26px 0 20px; }
.tab { border: 0; background: transparent; padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--dim); }
.tab.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin: 18px 0; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
.card .k { font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.card .v { font-size: 28px; font-weight: 700; margin-top: 6px; }
.fset { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 16px; }
.fset h3 { margin: 0 0 14px; font-size: 15px; font-weight: 700; }
.frow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.frow:last-child { margin-bottom: 0; }
.lbl { font-size: 13px; color: var(--dim); font-weight: 600; width: 86px; flex: 0 0 86px; }
.chip { padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; background: var(--panel); }
.chip.on { background: var(--text); border-color: var(--text); color: #fff; }
.startbar { display: flex; align-items: center; gap: 16px; margin-top: 22px; }
#btn-start { font-size: 16px; padding: 13px 34px; border-radius: 12px; }
select, input[type=number], input[type=text] { font-family: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: 0 0 40px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background: var(--border2); border-radius: 999px; transition: .2s; }
.slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
input:checked + .slider { background: var(--blue); }
input:checked + .slider:before { transform: translateX(18px); }

.prog-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); margin-bottom: 8px; }
.prog-bar-bg { flex: 0 1 300px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 0 16px; }
.prog-bar-fg { height: 100%; background: var(--green); border-radius: 4px; }

.browse-table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.browse-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--bg2); }
.browse-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.browse-table tr:hover td { background: var(--bg2); cursor: pointer; }

/* ---------- TEST PLAYER ---------- */
#view-test { height: 100vh; display: flex; flex-direction: column; }
.top { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border); }
.top-l, .top-r { display: flex; align-items: center; gap: 10px; }
.sec-pill { font-size: 13.5px; font-weight: 600; background: var(--blue-bg); color: var(--blue-dark); padding: 6px 14px; border-radius: 999px; border: 0; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; padding: 7px 13px; }
.timer-box { display: flex; align-items: center; gap: 10px; }
.timer { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.tdiv { width: 1px; height: 22px; background: var(--border); }

.work { flex: 1; min-height: 0; display: flex; position: relative; background: var(--bg); }
.panes { display: flex; flex: 1; min-width: 0; transition: all .2s ease; }
.work.desmos-shift .panes { margin-right: 540px; }
.pane { overflow-y: auto; padding: 28px 36px 60px; }
.pane-q { flex: 1 1 35%; min-width: 0; background: var(--panel); border-right: 1px solid var(--border); }
.pane-a { flex: 1 1 35%; min-width: 0; background: var(--panel); border-right: 1px solid var(--border); }
.pane-p { flex: 1 1 30%; min-width: 0; background: var(--bg2); }
.panes.solo { justify-content: center; }
.panes.solo .pane-q { display: none; }
.panes.solo .pane-a { flex: 0 1 860px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.panes.with-exp .pane-q { flex: 1 1 25%; }
.panes.with-exp .pane-a { flex: 1 1 25%; }
.panes.with-exp .pane-p { flex: 0 0 0; width: 0; overflow: hidden; }
.panes.with-exp .pane-p.open { flex: 0 0 30%; width: 30%; }

.qhead { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.qnum { min-width: 34px; height: 34px; border-radius: 9px; background: var(--text); color: #fff; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
.flag-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; color: var(--dim); border: 0; background: transparent; padding: 6px 8px; }
.flag-btn .fi { font-size: 15px; }
.flag-btn.on { color: var(--orange); font-weight: 600; }
.passage { font-size: 16.5px; line-height: 1.75; }
.passage p { margin: 0 0 16px; }
.stem { font-size: 16px; line-height: 1.6; margin-bottom: 22px; }
.stem p { margin: 0 0 12px; }
.stem .qimg img { display: block; margin: 16px 0; border-radius: 8px; }
.stem-text { white-space: pre-wrap; user-select: text; }
.img-toggle { margin-top: 14px; font-size: 12.5px; color: #555; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.img-toggle:hover { border-color: var(--border2); color: #222; }
.stem table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
.stem table th, .stem table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.stem table th { background: var(--bg2); font-weight: 600; }
.stem pre, .stem code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; background: var(--bg2); padding: 12px 16px; border-radius: 8px; overflow-x: auto; display: block; }

.choices { display: flex; flex-direction: column; gap: 14px; max-width: 680px; }
.choice { display: flex; align-items: flex-start; gap: 16px; text-align: left; padding: 18px 20px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--panel); font-size: 16.5px; line-height: 1.55; }
.choice:hover:not(:disabled) { border-color: var(--border2); background: var(--bg2); }
.badge { flex: 0 0 30px; width: 30px; height: 30px; border-radius: 7px; border: 1.5px solid var(--border2); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14.5px; color: var(--dim); margin-top: 1px; }
.choice img { display: block; margin: 8px 0; border-radius: 6px; max-width: 100%; }
.choice table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 14px; }
.choice table th, .choice table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.choice table th { background: var(--bg2); font-weight: 600; }
.choice.sel { border-color: var(--blue); background: var(--blue-bg); }
.choice.sel .badge { border-color: var(--blue); background: var(--blue); color: #fff; }
.choice.right { border-color: var(--green); background: var(--green-bg); }
.choice.right .badge { border-color: var(--green); background: var(--green); color: #fff; }
.choice.wrong { border-color: var(--red); background: var(--red-bg); }
.choice.wrong .badge { border-color: var(--red); background: var(--red); color: #fff; }
.choice.corrected { border-color: var(--orange); background: var(--orange-bg); }
.choice.corrected .badge { border-color: var(--orange); background: var(--orange); color: #fff; }
.choice.dim { opacity: .55; }
.ko-btn { flex: 0 0 22px; width: 22px; height: 22px; margin-top: 3px; border-radius: 50%; border: 1.5px dashed var(--border2); background: transparent; color: var(--dim2); font-size: 11px; font-weight: 700; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.ko-btn:hover { border-color: var(--dim); color: var(--dim); }
.ko-btn.on { border-style: solid; border-color: var(--red); background: var(--red-bg); color: var(--red); text-decoration: line-through; }

.gridin-wrap { max-width: 420px; }
.gridin { width: 100%; font-size: 18px; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 10px; font-weight: 500; }
.gridin:focus { border-color: var(--blue); }
.verdict { margin-top: 14px; font-weight: 700; font-size: 15px; }
.verdict.ok { color: var(--green); }
.verdict.bad { color: var(--red); }

.bot { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; background: var(--panel); border-top: 1px solid var(--border); }
.bot-l, .bot-r { display: flex; align-items: center; gap: 10px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; font-size: 16px; }
#pos-lbl { font-size: 13.5px; color: var(--dim); font-weight: 600; }
#btn-back { min-width: 90px; }
#btn-next { min-width: 90px; }
#btn-ai { display: inline-flex; align-items: center; gap: 6px; min-width: 90px; }

/* question map modal */
.modal-bg { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: flex; align-items: center; justify-content: center; z-index: 60; }
.modal { background: var(--panel); border-radius: 16px; padding: 22px; width: min(560px, 92vw); max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal h3 { margin: 0 0 14px; font-size: 16px; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
.map-cell { position: relative; height: 40px; border-radius: 9px; border: 1.5px solid var(--border); background: var(--panel); font-weight: 600; font-size: 13.5px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.map-cell.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.map-cell.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.map-cell.corrected { background: var(--orange-bg); border-color: var(--orange); color: var(--orange); }
.map-cell.current { outline: 2.5px solid var(--text); outline-offset: 1px; }
.map-cell.flagged::after { content: "⚑"; position: absolute; top: -7px; right: -4px; font-size: 11px; color: var(--orange); }
.map-legend { display: flex; gap: 16px; margin-top: 14px; font-size: 12.5px; color: var(--dim); }
.map-legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid var(--border2); }
.map-legend .l-corr::before { background: var(--green-bg); border-color: var(--green); }
.map-legend .l-wrong::before { background: var(--red-bg); border-color: var(--red); }
.map-legend .l-corr-w::before { background: var(--orange-bg); border-color: var(--orange); }
.map-legend .l-cur::before { outline: 2px solid var(--text); outline-offset: 1px; }

/* explanation drawer */
.drawer { flex: 0 0 0; width: 0; overflow: hidden; background: var(--panel); border-left: 1px solid var(--border); transition: flex-basis .18s ease, width .18s ease; display: flex; flex-direction: column; }
.drawer.open { flex: 0 0 430px; width: 430px; }
.dr-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 700; }
.dr-b { padding: 20px; overflow-y: auto; font-size: 14.5px; line-height: 1.65; }
.dr-b h4 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); }
.ans-line { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--green-bg); border: 1px solid var(--green); font-weight: 600; }
.kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 13.5px; }
.kv span:first-child { color: var(--dim); }

/* desmos */
.desmos-panel { position: fixed; right: 18px; bottom: 74px; width: min(520px, 44vw); height: min(560px, 68vh); min-width: 340px; min-height: 260px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 16px 48px rgba(0,0,0,.22); z-index: 50; display: flex; flex-direction: column; overflow: hidden; resize: both; }
.desmos-panel .dp-h { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; background: var(--bg2); cursor: move; user-select: none; }
.desmos-panel .dp-tabs { display: flex; gap: 6px; }
.desmos-panel .dp-tab { border: 1px solid var(--border); background: var(--panel); color: var(--dim); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
.desmos-panel .dp-tab.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.desmos-panel iframe { flex: 1; border: 0; width: 100%; }

/* more menu */
.more-menu { position: fixed; z-index: 70; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.16); padding: 6px; min-width: 210px; }
.more-menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; }
.more-menu button:hover { background: var(--bg2); }

/* results */
#view-results { height: 100vh; overflow-y: auto; }
.res-wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
.res-hero { text-align: center; margin-bottom: 28px; }
.res-hero h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.02em; }
.res-list { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.res-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
.res-item:hover { border-color: var(--border2); }
.res-ico { flex: 0 0 26px; text-align: center; font-weight: 800; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.pill.green { background: var(--green-bg); color: var(--green); }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.orange { background: var(--orange-bg); color: var(--orange); }
.pill.gray { background: var(--bg2); color: var(--dim); }
</style>
</head>
<body>
<div id="app">

<!-- ================= HOME ================= -->
<div id="view-home">
  <div class="home-wrap">
    <div class="brand">
      <div class="brand-dot">S</div>
      <div>
        <h1>SAT Question Bank</h1>
        <div class="sub" id="src-pill">Loading…</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
        <span id="user-name" class="sub" style="font-weight:600;display:none"></span>
        <button id="btn-auth" class="btn-p">Sign in with Google</button>
        <button class="theme-toggle" data-theme-toggle title="Toggle dark mode">🌙</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab on" data-tab="practice">Practice</button>
      <button class="tab" data-tab="dash">Dashboard</button>
      <button class="tab" data-tab="browse">Browse</button>
    </div>

    <div id="tab-practice">
      <div class="cards" id="home-stats"></div>
      <div class="fset">
        <h3>Build your practice set</h3>
        <div class="frow">
          <span class="lbl">Section</span>
          <button class="chip on" data-f="sec" data-v="all">Both</button>
          <button class="chip" data-f="sec" data-v="Math">Math</button>
          <button class="chip" data-f="sec" data-v="Reading &amp; Writing">Reading &amp; Writing</button>
        </div>
        <div class="frow">
          <span class="lbl">Domain</span>
          <button class="chip on" data-f="dom" data-v="all">All</button>
          <span id="domain-chips" style="display:contents"></span>
        </div>
        <div class="frow">
          <span class="lbl">Difficulty</span>
          <button class="chip on" data-f="diff" data-v="all">Any</button>
          <button class="chip" data-f="diff" data-v="Easy">Easy</button>
          <button class="chip" data-f="diff" data-v="Medium">Medium</button>
          <button class="chip" data-f="diff" data-v="Hard">Hard</button>
        </div>
        <div class="frow">
          <span class="lbl">Source</span>
          <button class="chip on" data-f="src" data-v="official">Question Bank</button>
          <button class="chip" data-f="src" data-v="mistakes">My PT Mistakes</button>
        </div>
        <div class="frow">
          <span class="lbl">Questions</span>
          <select id="num-q">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="0">All</option>
          </select>
          <span class="lbl" style="width:auto;flex:none;margin-left:18px;">Calculator</span>
          <label class="switch"><input type="checkbox" id="calc-toggle" checked><span class="slider"></span></label>
        </div>
        <div class="startbar">
          <button class="btn-p" id="btn-start">Start practice</button>
          <span id="start-count" style="color:var(--dim); font-weight:500;"></span>
        </div>
      </div>
    </div>

    <div id="tab-dash" class="hide">
      <div class="cards" id="db-overview"></div>
      <h3 style="font-size:15px; margin:26px 0 10px;">Performance by section</h3>
      <div id="db-sections"></div>
    </div>

    <div id="tab-browse" class="hide">
      <div class="frow" style="margin-bottom:12px;">
        <input type="text" id="browse-q" placeholder="Search domain, skill, id…" style="flex:1; max-width:380px;">
        <span id="browse-count" style="color:var(--dim); font-size:13px;"></span>
      </div>
      <table class="browse-table">
        <thead><tr><th style="width:110px;">ID</th><th>Section</th><th>Domain</th><th>Skill</th><th>Diff.</th><th>Type</th></tr></thead>
        <tbody id="browse-body"></tbody>
      </table>
      <div class="frow" style="margin-top:14px;">
        <button id="browse-prev">← Prev</button>
        <span id="browse-page" style="color:var(--dim); font-size:13px;"></span>
        <button id="browse-next">Next →</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= TEST PLAYER ================= -->
<div id="view-test" class="hide">
  <div class="top">
    <div class="top-l">
      <span class="sec-pill" id="t-sec">Section</span>
      <button class="tbtn" id="btn-directions">Directions</button>
    </div>
    <div class="timer-box">
      <span class="timer mono" id="q-clock">0:00</span>
      <span class="tdiv"></span>
      <button class="tbtn" id="btn-hide-timer">Hide</button>
      <button class="tbtn" id="btn-pause">Pause</button>
    </div>
    <div class="top-r">
      <button class="tbtn" id="btn-calc" title="Desmos calculator">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><circle cx="9" cy="12" r="0.5"/><circle cx="12" cy="12" r="0.5"/><circle cx="15" cy="12" r="0.5"/><circle cx="9" cy="16" r="0.5"/><circle cx="12" cy="16" r="0.5"/><circle cx="15" cy="16" r="0.5"/></svg>
        Calculator
      </button>
      <button class="tbtn" id="btn-more">More ▾</button>
      <button class="theme-toggle" data-theme-toggle title="Toggle dark mode">🌙</button>
    </div>
  </div>

  <div class="work" id="work">
    <div class="panes" id="panes">
      <div class="pane pane-q" id="pane-q"></div>
      <div class="pane pane-a" id="pane-a"></div>
      <div class="pane pane-p" id="pane-p"></div>
    </div>
    <aside class="drawer" id="drawer">
      <div class="dr-h"><span>Explanation</span><button class="icon-btn" id="dr-close">✕</button></div>
      <div class="dr-b" id="dr-body"></div>
    </aside>
  </div>

  <div class="bot">
    <div class="bot-l">
      <button class="icon-btn" id="btn-map" title="Question map">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <span id="pos-lbl">1 of 1</span>
    </div>
    <div class="bot-r">
      <button id="btn-ai" title="AI Tutor">✦ AI</button>
      <button id="btn-back">Back</button>
      <button class="btn-p" id="btn-next">Next</button>
    </div>
  </div>
</div>

<!-- ================= RESULTS ================= -->
<div id="view-results" class="hide">
  <div class="res-wrap">
    <div class="res-hero">
      <h1>Practice complete</h1>
      <div style="color:var(--dim);" id="res-sub"></div>
    </div>
    <div class="cards">
      <div class="card"><div class="k">Attempted</div><div class="v mono" id="res-done">0</div></div>
      <div class="card"><div class="k">Correct</div><div class="v mono" id="res-correct" style="color:var(--green)">0</div></div>
      <div class="card"><div class="k">Accuracy</div><div class="v mono" id="res-acc">0%</div></div>
      <div class="card"><div class="k">Time</div><div class="v mono" id="res-time">—</div></div>
    </div>
    <div class="frow" style="margin:22px 0;">
      <button class="btn-p" id="res-retry-wrong">Retry mistakes</button>
      <button id="res-home">Back to question bank</button>
    </div>
    <h3 style="font-size:15px;">Question review</h3>
    <div class="res-list" id="res-list"></div>
  </div>
</div>

</div>

<div id="modal-root"></div>
<div id="overlay-root"></div>

<script>
(function(){
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LS = {
  get(k,d){ try{ const v=localStorage.getItem('satq_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('satq_'+k, JSON.stringify(v)); }catch(e){} }
};

let QS = [], PROG = {};
let F = LS.get('filters', { sec:'all', dom:'all', diff:'all', src:'official' });
let S = null;
let TAB = 'practice';

// ---------------- theme ----------------
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  LS.set('theme', t);
  document.querySelectorAll('[data-theme-toggle]').forEach(b => b.textContent = t === 'dark' ? '☀️' : '🌙');
}
document.querySelectorAll('[data-theme-toggle]').forEach(b => b.onclick = () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
applyTheme(LS.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

// ---------------- data ----------------
async function load() {
  try {
    const [qRes, pRes] = await Promise.all([fetch('/api/questions'), fetch('/api/progress', { headers: sbHeaders() })]);
    QS = await qRes.json();
    QS.forEach(q => {
      try { q.choices = typeof q.choices_json === 'string' ? JSON.parse(q.choices_json) : (q.choices_json || []); }
      catch(e){ q.choices = []; }
      try {
        const a = typeof q.correct_answer === 'string' ? JSON.parse(q.correct_answer) : (q.correct_answer || []);
        q.answer = Array.isArray(a) ? a.join('') : String(a);
      } catch(e){ q.answer = q.correct_answer || ''; }
    });
    const progRows = pRes.ok ? await pRes.json() : [];
    PROG = {};
    progRows.forEach(r => PROG[r.question_id] = r);
    $('src-pill').textContent = `${QS.length.toLocaleString()} official College Board questions · synced with Cloudflare D1`;
  } catch(e) {
    $('src-pill').textContent = 'Could not reach the server — is server.js running?';
  }
  drawHomeStats();
  drawFilters();
  drawDash();
}

// ---------------- home ----------------
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  TAB = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x===b));
  $('tab-practice').classList.toggle('hide', TAB!=='practice');
  $('tab-dash').classList.toggle('hide', TAB!=='dash');
  $('tab-browse').classList.toggle('hide', TAB!=='browse');
  if (TAB==='dash') drawDash();
  if (TAB==='browse') drawBrowse();
});

function pool() {
  let a = QS.filter(q => {
    if (F.src === 'mistakes') return ['PT4','PT6','PT8','PT10','mistake'].includes(q.label);
    return !['PT4','PT6','PT8','PT10','mistake'].includes(q.label);
  });
  if (F.sec !== 'all') a = a.filter(q => q.section === F.sec);
  if (F.dom !== 'all') a = a.filter(q => q.domain === F.dom);
  if (F.diff !== 'all') a = a.filter(q => (q.difficulty||'').toLowerCase() === F.diff.toLowerCase());
  a = a.slice();
  for (let i=a.length-1; i>0; i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  const n = parseInt($('num-q').value);
  if (n > 0) a = a.slice(0, n);
  return a;
}

function drawHomeStats() {
  const att = Object.keys(PROG).length;
  let corr = 0;
  Object.values(PROG).forEach(p => { if (p.marker === 'Green') corr++; });
  $('home-stats').innerHTML = `
    <div class="card"><div class="k">Question bank</div><div class="v mono">${QS.length.toLocaleString()}</div></div>
    <div class="card"><div class="k">Attempted</div><div class="v mono">${att}</div></div>
    <div class="card"><div class="k">Accuracy</div><div class="v mono">${att?Math.round(corr/att*100):0}%</div></div>`;
}

function drawFilters() {
  document.querySelectorAll('#tab-practice .chip').forEach(b => {
    const f = b.dataset.f, v = b.dataset.v;
    if (f !== 'dom') b.classList.toggle('on', F[f] === v);
    b.onclick = () => {
      F[f] = v;
      if (f === 'sec') F.dom = 'all';
      LS.set('filters', F);
      drawFilters();
    };
  });
  const doms = [...new Set(QS.filter(q => F.src!=='mistakes' && (F.sec==='all'||q.section===F.sec)).map(q=>q.domain).filter(Boolean))].sort();
  $('domain-chips').innerHTML = doms.map(d =>
    `<button class="chip ${F.dom===d?'on':''}" data-f="dom" data-v="${esc(d)}">${esc(d)}</button>`).join('');
  $('domain-chips').querySelectorAll('.chip').forEach(b => {
    b.classList.toggle('on', F.dom === b.dataset.v);
    b.onclick = () => { F.dom = b.dataset.v; LS.set('filters', F); drawFilters(); };
  });
  const p = pool();
  $('start-count').textContent = `${p.length} matching questions`;
  $('btn-start').disabled = p.length === 0;
}

$('num-q').onchange = drawFilters;
$('btn-start').onclick = () => start(pool());

// ---------------- dashboard ----------------
function drawDash() {
  let att=0, corr=0, ms=0;
  const bySec = { 'Math':{a:0,c:0,n:0}, 'Reading & Writing':{a:0,c:0,n:0} };
  QS.forEach(q => { if (bySec[q.section]) bySec[q.section].n++; });
  Object.entries(PROG).forEach(([id,p]) => {
    if (!p.attempts) return;
    att++; if (p.marker==='Green') corr++; ms += p.time_taken_ms||0;
    const q = QS.find(x=>x.id===id);
    if (q && bySec[q.section]) { bySec[q.section].a++; if (p.marker==='Green') bySec[q.section].c++; }
  });
  $('db-overview').innerHTML = `
    <div class="card"><div class="k">Questions attempted</div><div class="v mono">${att}</div></div>
    <div class="card"><div class="k">Accuracy</div><div class="v mono">${att?Math.round(corr/att*100):0}%</div></div>
    <div class="card"><div class="k">Avg time / question</div><div class="v mono">${att?Math.round(ms/att/1000):0}s</div></div>`;
  $('db-sections').innerHTML = Object.entries(bySec).map(([s,v]) => {
    const pct = v.a ? Math.round(v.c/v.a*100) : 0;
    return `<div class="prog-item"><div style="flex:0 0 150px;font-weight:600;">${s}</div>
      <div class="prog-bar-bg"><div class="prog-bar-fg" style="width:${pct}%"></div></div>
      <div class="mono" style="flex:0 0 110px;text-align:right;color:var(--dim);">${pct}% · ${v.a}/${v.n}</div></div>`;
  }).join('');
}

// ---------------- browse ----------------
let browsePage = 0;
function drawBrowse() {
  const q = ($('browse-q').value||'').toLowerCase();
  let list = QS.filter(x => !q || [x.id,x.domain,x.skill,x.section,x.difficulty].join(' ').toLowerCase().includes(q));
  $('browse-count').textContent = `${list.length.toLocaleString()} questions`;
  const per = 50, pages = Math.max(1, Math.ceil(list.length/per));
  browsePage = Math.min(browsePage, pages-1);
  const slice = list.slice(browsePage*per, browsePage*per+per);
  $('browse-body').innerHTML = slice.map(x => `
    <tr data-id="${esc(x.id)}">
      <td class="mono" style="color:var(--dim)">${esc(x.id)}</td>
      <td>${esc(x.section)}</td>
      <td>${esc(x.domain)}</td>
      <td>${esc(x.skill)}</td>
      <td>${esc(x.difficulty)}</td>
      <td>${x.qtype==='spr'?'SPR':'MCQ'}</td>
    </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--dim);padding:24px;">No matches</td></tr>';
  $('browse-page').textContent = `Page ${browsePage+1} / ${pages}`;
  $('browse-body').querySelectorAll('tr[data-id]').forEach(tr => {
    tr.onclick = () => previewQuestion(tr.dataset.id);
  });
}
$('browse-q').oninput = () => { browsePage = 0; drawBrowse(); };
$('browse-prev').onclick = () => { if (browsePage>0){ browsePage--; drawBrowse(); } };
$('browse-next').onclick = () => { browsePage++; drawBrowse(); };

function previewQuestion(id) {
  const q = QS.find(x=>x.id===id);
  if (!q) return;
  const root = $('modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal" style="width:min(760px,94vw)">
    <div class="frow" style="justify-content:space-between; margin-bottom:14px;">
      <strong>${esc(q.id)} · ${esc(q.section)} · ${esc(q.difficulty)}</strong>
      <button id="pv-close">Close</button>
    </div>
    <div style="max-height:56vh; overflow-y:auto;">${renderStem(q)}
      <div class="choices" style="margin-top:16px;">${q.choices.map(c => choiceHTML(q, c, null, true)).join('')}</div>
      ${q.qtype==='spr' ? `<div class="ans-line" style="margin-top:14px;">Answer: ${esc(q.answer)||'(see image)'}</div>` : ''}
    </div>
    <div style="margin-top:14px; color:var(--dim); font-size:13.5px;" class="cb">${q.explanation_html||''}</div>
  </div></div>`;
  $('pv-close').onclick = () => root.innerHTML = '';
  root.querySelector('.modal-bg').onclick = (e) => { if (e.target.classList.contains('modal-bg')) root.innerHTML=''; };
}

// ---------------- session ----------------
function start(items) {
  if (!items.length) return;
  S = {
    items, i: 0,
    ans: {}, checked: {}, flags: {}, ko: {},
    started: Date.now(), ended: null,
    qStart: Date.now(),
    paused: false, timerHidden: false,
    fromResults: false
  };
  $('view-home').classList.add('hide');
  $('view-results').classList.add('hide');
  $('view-test').classList.remove('hide');
  $('btn-calc').classList.toggle('hide', items[0].section !== 'Math' && !items.some(x=>x.section==='Math'));
  loadQuestion();
  startTimer();
}

function curQ() { return S.items[S.i]; }

function startTimer() {
  S._int = setInterval(() => {
    if (!S || S.paused) return;
    renderQTimer();
  }, 250);
}
function stopTimer() { if (S && S._int) clearInterval(S._int); }
function renderQTimer() {
  if (!S) return;
  const s = Math.round((Date.now() - S.qStart) / 1000);
  const m = Math.floor(s/60), sec = s%60;
  $('q-clock').textContent = `${m}:${String(sec).padStart(2,'0')}`;
}

$('btn-pause').onclick = () => {
  if (!S) return;
  S.paused = !S.paused;
  $('btn-pause').textContent = S.paused ? 'Resume' : 'Pause';
  $('panes').style.visibility = S.paused ? 'hidden' : 'visible';
};
$('btn-hide-timer').onclick = () => {
  if (!S) return;
  S.timerHidden = !S.timerHidden;
  $('q-clock').style.visibility = S.timerHidden ? 'hidden' : 'visible';
  $('btn-hide-timer').textContent = S.timerHidden ? 'Show' : 'Hide';
};

// ---------------- question rendering ----------------
function hasStemText(q) {
  return q.stem_text && q.stem_text.trim().length > 20;
}

function stemTextView(q) {
  return `<div class="stemtext-wrap">
    <div class="stem-text cb">${esc(q.stem_text.trim())}</div>
    <button type="button" class="img-toggle">Show original image</button>
    <div class="orig-img" hidden>${q.stem_html}</div>
  </div>`;
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.img-toggle');
  if (!btn) return;
  const wrap = btn.closest('.stemtext-wrap');
  const orig = wrap.querySelector('.orig-img');
  const txt = wrap.querySelector('.stem-text');
  const showing = !orig.hidden;
  orig.hidden = showing;
  txt.style.display = showing ? '' : 'none';
  btn.textContent = showing ? 'Show original image' : 'Show text';
});

function renderStem(q) {
  let html = q.stem_html || '';
  const isImg = html.includes('<div class="qimg">');
  if (isImg) {
    return hasStemText(q) ? stemTextView(q) : html;
  }
  html = html.replace(/<blockquote[^>]*>[\s\S]*?<\/blockquote>/gi, '');
  html = html.replace(/<h3>Passage<\/h3>[\s\S]*?<h3>Question<\/h3>/gi, '');
  html = html.replace(/<h3>Question<\/h3>/gi, '');
  html = html.replace(/<table[^>]*>([\s\S]*?)<\/table>/gi, (match, inner) => {
    const rows = inner.match(/<tr[^>]*>[\s\S]*?<\/tr>/gi) || [];
    const lines = rows.map(tr => {
      const cells = tr.match(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi) || [];
      return cells.map(c => c.replace(/<[^>]+>/g, '').trim()).join(' | ');
    });
    return '<pre><code>' + lines.join('\n') + '</code></pre>';
  });
  return html;
}

function choiceHTML(q, c, picked, staticMode) {
  const letter = c.letter || '?';
  const isGraphImg = c.img && (c.img.includes('_stem.') || c.img.includes('_a.') || c.img.includes('_b.') || c.img.includes('_c.') || c.img.includes('_d.'));
  let body = '';
  if (c.img && isGraphImg) {
    body = `<img src="${esc(c.img)}" alt="Choice ${esc(letter)}">`;
  } else if (c.img) {
    body = `<img src="${esc(c.img)}" alt="Choice ${esc(letter)}">`;
  } else {
    let content = c.content || '';
    content = content.replace(/<p>/gi, '').replace(/<\/p>/gi, '');
    body = `<span>${content}</span>`;
  }
  const checked = !staticMode && S.checked[q.id];
  let cls = 'choice';
  if (!staticMode) {
    if (picked === letter && !checked) cls += ' sel';
    if (checked) {
      const prog = PROG[q.id];
      const wasWrong = prog && prog.marker === 'Red';
      const nowCorrect = isRight(q, letter);
      if (nowCorrect && wasWrong) cls += ' corrected';
      else if (nowCorrect) cls += ' right';
      else if (picked === letter) cls += ' wrong';
      else cls += ' dim';
    }
  }
  const ko = !staticMode && S.ko[q.id] && S.ko[q.id].includes(letter) ? ' on' : '';
  return `<div class="${cls}" data-letter="${esc(letter)}">
    <span class="badge">${esc(letter)}</span>
    <span style="flex:1; min-width:0;">${body}</span>
    ${staticMode ? '' : `<button class="ko-btn${ko}" data-ko="${esc(letter)}" title="Eliminate choice"><span style="text-decoration:line-through">${esc(letter)}</span></button>`}
  </div>`;
}

function loadQuestion() {
  const q = curQ();
  $('t-sec').textContent = q.domain && q.domain !== 'General' ? q.domain : q.section;
  $('pos-lbl').textContent = `${S.i+1} of ${S.items.length}`;
  $('btn-back').disabled = S.i === 0;
  $('btn-next').textContent = S.i === S.items.length - 1 ? 'Finish' : 'Next';
  S.qStart = Date.now();
  renderQTimer();

  const isRW = q.section !== 'Math';
  const stem = q.stem_html || '';
  let passage = '', prompt = stem;
  const splitIdx = stem.indexOf('<h3>Prompt</h3>');
  if (splitIdx !== -1) {
    passage = stem.substring(0, splitIdx).replace('<h3>Passage</h3>', '');
    prompt = stem.substring(splitIdx + 15);
  }
  const hasPassage = isRW && (passage || stem.includes('<div class="qimg">'));

  const panes = $('panes');
  panes.classList.toggle('solo', !hasPassage);
  panes.classList.remove('with-exp');
  $('pane-p').classList.remove('open');

  const qhead = `<div class="qhead">
    <span class="qnum">${S.i+1}</span>
    <button class="flag-btn ${S.flags[q.id]?'on':''}" id="btn-flag"><span class="fi">⚑</span> Mark for Review</button>
  </div>`;

  if (hasPassage) {
    let passageHtml = passage;
    if (stem.includes('<div class="qimg">')) {
      prompt = '';
      passageHtml = hasStemText(q) ? stemTextView(q) : stem;
    }
    $('pane-q').innerHTML = `<div class="passage cb">${passageHtml}</div>`;
    $('pane-a').innerHTML = `${qhead}<div class="stem cb">${prompt}</div><div id="answer-area"></div>`;
    $('pane-q').style.display = 'block';
  } else {
    $('pane-q').style.display = 'none';
    $('pane-a').innerHTML = `${qhead}<div class="stem cb">${renderStem(q)}</div><div id="answer-area"></div>`;
  }
  renderAnswerArea(q);

  $('btn-flag').onclick = () => {
    S.flags[q.id] = !S.flags[q.id];
    $('btn-flag').classList.toggle('on', !!S.flags[q.id]);
  };
  closeDrawer();
}

function renderAnswerArea(q) {
  const target = $('answer-area');
  const picked = S.ans[q.id];
  const checked = S.checked[q.id];
  let html = '';
  if (q.qtype === 'spr' || !q.choices.length) {
    html += `<div class="gridin-wrap">
      <input class="gridin" id="gi" type="text" placeholder="Enter your answer" value="${esc(picked&&picked!=='TIMEOUT'?picked:'')}" ${checked?'disabled':''}>
      ${!checked ? '<button class="btn-p" id="gi-submit" style="margin-top:12px;">Submit</button>' : ''}
      <div id="spr-verdict"></div>
    </div>`;
  } else {
    html += `<div class="choices" id="choices">${q.choices.map(c => choiceHTML(q, c, picked, false)).join('')}</div>`;
    if (!checked) html += `<div style="margin-top:14px; color:var(--dim2); font-size:13px;">Choose one answer</div>`;
  }
  target.innerHTML = html;

  if (q.qtype === 'spr' || !q.choices.length) {
    const gi = $('gi');
    if (!checked) {
      const submit = () => { S.ans[q.id] = gi.value.trim(); grade(q); };
      $('gi-submit').onclick = submit;
      gi.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
    } else {
      const ok = isRight(q, picked);
      const v = $('spr-verdict');
      if (v) v.innerHTML = ok
        ? '<div class="verdict ok">✓ Correct</div>'
        : `<div class="verdict bad">✗ Incorrect — correct answer: ${esc(q.answer)||'(shown in explanation)'}</div>`;
    }
  } else {
    target.querySelectorAll('.choice').forEach(el => {
      const letter = el.dataset.letter;
      const koBtn = el.querySelector('.ko-btn');
      if (koBtn) koBtn.onclick = (e) => {
        e.stopPropagation();
        S.ko[q.id] = S.ko[q.id] || [];
        const idx = S.ko[q.id].indexOf(letter);
        if (idx >= 0) S.ko[q.id].splice(idx, 1); else S.ko[q.id].push(letter);
        koBtn.classList.toggle('on');
      };
      if (!S.checked[q.id]) el.onclick = () => { S.ans[q.id] = letter; grade(q); };
    });
  }
}

function isRight(q, val) {
  if (!val || val === 'TIMEOUT') return false;
  const a = String(q.answer||'').trim().toUpperCase();
  if (!a) return null;
  if (q.qtype === 'spr' || !q.choices.length) {
    const clean = (s) => String(s).toUpperCase().replace(/[\s,$]/g,'').replace(/\.0+$/,'');
    const av = clean(a), vv = clean(val);
    const af = parseFloat(av), vf = parseFloat(vv);
    if (!isNaN(af) && !isNaN(vf)) return Math.abs(af-vf) < 1e-9;
    return av === vv;
  }
  return a === String(val).trim().toUpperCase();
}

function grade(q) {
  S.checked[q.id] = true;
  const ok = isRight(q, S.ans[q.id]);
  const p = PROG[q.id] || { question_id: q.id, attempts:0, corrects:0 };
  p.attempts++;
  p.corrects += (ok === true ? 1 : 0);
  const wasWrong = p.marker === 'Red';
  if (ok === true && wasWrong) {
    p.marker = 'Orange';
  } else if (ok === true) {
    p.marker = 'Green';
  } else {
    p.marker = 'Red';
  }
  p.last_reviewed = new Date().toISOString();
  p.time_taken_ms = Math.round((Date.now()-S.qStart));
  PROG[q.id] = p;
  fetch('/api/progress', { method:'POST', headers:{'Content-Type':'application/json', ...sbHeaders()}, body:JSON.stringify(p) }).catch(()=>{});
  renderAnswerArea(q);
  openDrawer();
}

// ---------------- explanation drawer ----------------
function openDrawer() {
  const q = curQ();
  const ok = isRight(q, S.ans[q.id]);
  $('dr-body').innerHTML = `
    <div class="ans-line" style="${ok===false?'background:var(--red-bg);border-color:var(--red);':''}">
      ${ok===false?'✗ Your answer: '+esc(S.ans[q.id])+' · ':''}Correct answer: <strong style="margin-left:4px;">${esc(q.answer)||'(below)'}</strong>
    </div>
    <h4>Explanation</h4>
    <div class="cb">${q.explanation_html || '<p>No explanation available for this question.</p>'}</div>
    <h4>Question info</h4>
    <div class="kv"><span>Domain</span><span>${esc(q.domain||'—')}</span></div>
    <div class="kv"><span>Skill</span><span>${esc(q.skill||'—')}</span></div>
    <div class="kv"><span>Difficulty</span><span>${esc(q.difficulty||'—')}</span></div>
    <div class="kv"><span>Source</span><span>${esc(q.source||'CollegeBoard')} ${q.label&&q.label.startsWith('PT')?'· '+esc(q.label):''}</span></div>
    <div class="kv"><span>ID</span><span class="mono">${esc(q.id)}</span></div>`;
  $('drawer').classList.add('open');
}
function closeDrawer(){ $('drawer').classList.remove('open'); }
$('dr-close').onclick = closeDrawer;

// ---------------- navigation ----------------
$('btn-next').onclick = () => {
  if (!S) return;
  if (S.i < S.items.length-1) { S.i++; loadQuestion(); }
  else finish();
};
$('btn-back').onclick = () => { if (S && S.i > 0) { S.i--; loadQuestion(); } };

document.addEventListener('keydown', (e) => {
  if (!S || $('view-test').classList.contains('hide')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') $('btn-next').click();
  else if (e.key === 'ArrowLeft') $('btn-back').click();
  else if (/^[1-4]$/.test(e.key)) {
    const q = curQ();
    if (q.choices && q.choices.length && !S.checked[q.id]) {
      const c = q.choices[parseInt(e.key)-1];
      if (c) { S.ans[q.id] = c.letter; grade(q); }
    }
  }
});

// question map
$('btn-map').onclick = () => {
  const root = $('modal-root');
  const cells = S.items.map((q, idx) => {
    const cls = ['map-cell'];
    const prog = PROG[q.id];
    const checked = S.checked[q.id];
    const ok = checked && isRight(q, S.ans[q.id]);
    if (checked) {
      if (ok) {
        if (prog && prog.marker === 'Orange') cls.push('corrected');
        else cls.push('correct');
      } else {
        cls.push('wrong');
      }
    }
    if (S.flags[q.id]) cls.push('flagged');
    if (idx === S.i) cls.push('current');
    return `<button class="${cls.join(' ')}" data-idx="${idx}">${idx+1}</button>`;
  }).join('');
  root.innerHTML = `<div class="modal-bg"><div class="modal">
    <h3>Questions</h3>
    <div class="map-grid">${cells}</div>
    <div class="map-legend"><span class="l-corr">Correct</span><span class="l-wrong">Wrong</span><span class="l-corr-w">Corrected (was wrong)</span><span class="l-cur">Current</span></div>
    <div class="frow" style="margin-top:16px; justify-content:flex-end;"><button id="map-close">Close</button></div>
  </div></div>`;
  root.querySelectorAll('.map-cell').forEach(b => b.onclick = () => { S.i = parseInt(b.dataset.idx); root.innerHTML=''; loadQuestion(); });
  $('map-close').onclick = () => root.innerHTML = '';
  root.querySelector('.modal-bg').onclick = (e) => { if (e.target.classList.contains('modal-bg')) root.innerHTML=''; };
};

// ---------------- directions ----------------
$('btn-directions').onclick = () => {
  const q = curQ();
  const root = $('modal-root');
  const dir = q.section === 'Math'
    ? '<p>For each question, choose the best answer or enter your response in the grid-in field. You may use a calculator and the provided Desmos graphing calculator.</p><p>Notes: All variables and expressions represent real numbers unless indicated otherwise. Figures are drawn to scale unless noted.</p>'
    : '<p>Each passage or pair of passages is followed by a question. Choose the best answer to each question based on what is stated or implied in the passage(s) or in the supplementary material.</p>';
  root.innerHTML = `<div class="modal-bg"><div class="modal"><h3>Directions</h3>${dir}
    <div class="frow" style="justify-content:flex-end; margin-top:16px;"><button class="btn-p" id="dir-ok">Got it</button></div></div></div>`;
  $('dir-ok').onclick = () => root.innerHTML = '';
  root.querySelector('.modal-bg').onclick = (e) => { if (e.target.classList.contains('modal-bg')) root.innerHTML=''; };
};

// ---------------- more menu ----------------
$('btn-more').onclick = (e) => {
  e.stopPropagation();
  closeMenus();
  const m = document.createElement('div');
  m.className = 'more-menu';
  m.style.top = '52px';
  m.style.right = '18px';
  m.innerHTML = `
    <button id="mm-clear-ko">Clear eliminations</button>
    <button id="mm-explanation">Show explanation</button>
    <button id="mm-quit" style="color:var(--red);">End session</button>`;
  $('overlay-root').appendChild(m);
  $('mm-clear-ko').onclick = () => { S.ko[curQ().id] = []; loadQuestion(); closeMenus(); };
  $('mm-explanation').onclick = () => { if (S.checked[curQ().id]) openDrawer(); closeMenus(); };
  $('mm-quit').onclick = () => { confirmModal('End this practice session? Progress on answered questions is saved.', () => { stopTimer(); S=null; showHome(); }); closeMenus(); };
};
function closeMenus(){ document.querySelectorAll('.more-menu').forEach(x=>x.remove()); }
document.addEventListener('click', (e) => { if (!e.target.closest('.more-menu')) closeMenus(); });

function confirmModal(msg, onYes) {
  const root = $('modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal" style="width:min(420px,90vw);">
    <p style="margin:0 0 18px;">${msg}</p>
    <div class="frow" style="justify-content:flex-end;"><button id="cm-no">Cancel</button><button class="btn-p" id="cm-yes">Confirm</button></div>
  </div></div>`;
  $('cm-no').onclick = () => root.innerHTML='';
  $('cm-yes').onclick = () => { root.innerHTML=''; onYes(); };
}

// ---------------- desmos ----------------
const DESMOS_SRC = {
  graphing: 'https://www.desmos.com/testing/collegeboard/graphing',
  scientific: 'https://www.desmos.com/testing/collegeboard/scientific'
};
let desmosOpen = false;
let desmosPanel = null;
let desmosDrag = null;
$('btn-calc').onclick = () => {
  desmosOpen = !desmosOpen;
  let dp = $('desmos-panel');
  $('work').classList.toggle('desmos-shift', desmosOpen);
  if (desmosOpen) {
    if (!dp) {
      dp = document.createElement('div');
      dp.id = 'desmos-panel';
      dp.className = 'desmos-panel';
      dp.innerHTML = `<div class="dp-h">
          <div class="dp-tabs">
            <button class="dp-tab on" data-mode="graphing">Graphing</button>
            <button class="dp-tab" data-mode="scientific">Scientific</button>
          </div>
          <button class="icon-btn" id="dp-close" style="width:28px;height:28px;">✕</button>
        </div>
        <iframe src="${DESMOS_SRC.graphing}" allow="fullscreen"></iframe>`;
      document.body.appendChild(dp);
      desmosPanel = dp;
      $('dp-close').onclick = () => { desmosOpen = false; dp.remove(); $('work').classList.remove('desmos-shift'); };
      dp.querySelectorAll('.dp-tab').forEach(tab => tab.onclick = () => {
        dp.querySelectorAll('.dp-tab').forEach(t => t.classList.toggle('on', t === tab));
        dp.querySelector('iframe').src = DESMOS_SRC[tab.dataset.mode];
      });
      const header = dp.querySelector('.dp-h');
      header.onmousedown = (e) => {
        if (e.target.closest('.dp-tab, #dp-close')) return;
        e.preventDefault();
        const rect = dp.getBoundingClientRect();
        desmosDrag = { startX: e.clientX, startY: e.clientY, origLeft: rect.left, origTop: rect.top };
        document.onmousemove = (ev) => {
          if (!desmosDrag) return;
          const dx = ev.clientX - desmosDrag.startX;
          const dy = ev.clientY - desmosDrag.startY;
          dp.style.left = (desmosDrag.origLeft + dx) + 'px';
          dp.style.top = (desmosDrag.origTop + dy) + 'px';
          dp.style.right = 'auto';
          dp.style.bottom = 'auto';
        };
        document.onmouseup = () => { desmosDrag = null; document.onmousemove = null; document.onmouseup = null; };
      };
    }
  } else if (dp) dp.remove();
};

// ---------------- finish / results ----------------
function finish() {
  stopTimer();
  S.ended = Date.now();
  const done = Object.keys(S.checked).length;
  let right = 0;
  S.items.forEach(q => { if (S.checked[q.id] && isRight(q, S.ans[q.id]) === true) right++; });
  const secs = Math.round((S.ended - S.started)/1000);
  S.results = { done, right, secs };
  S.wrongIds = S.items.filter(q => S.checked[q.id] && isRight(q, S.ans[q.id]) !== true).map(q=>q.id);
  S.untriedIds = S.items.filter(q => !S.checked[q.id]).map(q=>q.id);

  $('view-test').classList.add('hide');
  $('view-results').classList.remove('hide');
  $('res-sub').textContent = `${S.items.length} questions`;
  $('res-done').textContent = done;
  $('res-correct').textContent = right;
  $('res-acc').textContent = done ? Math.round(right/done*100)+'%' : '—';
  $('res-time').textContent = `${Math.floor(secs/60)}m ${secs%60}s`;
  $('res-list').innerHTML = S.items.map((q, idx) => {
    const checked = S.checked[q.id];
    const ok = checked && isRight(q, S.ans[q.id]) === true;
    const prog = PROG[q.id];
    const wasWrong = prog && prog.marker === 'Orange';
    let status = 'gray', ico = '<span style="color:var(--dim2)">—</span>', pillText = 'Skipped';
    if (checked) {
      if (ok) {
        if (wasWrong) { status = 'orange'; ico = '<span style="color:var(--orange)">✓</span>'; pillText = 'Corrected'; }
        else { status = 'green'; ico = '<span style="color:var(--green)">✓</span>'; pillText = 'Correct'; }
      } else { status = 'red'; ico = '<span style="color:var(--red)">✗</span>'; pillText = 'Wrong'; }
    }
    return `<div class="res-item" data-idx="${idx}">
      <div class="res-ico">${ico}</div>
      <div style="flex:1; min-width:0;">
        <div style="font-weight:600; font-size:14px;">${idx+1}. ${esc(q.domain||q.section)}</div>
        <div style="font-size:12.5px; color:var(--dim);">${esc(q.skill||'')} · ${esc(q.difficulty||'')}</div>
      </div>
      <span class="pill ${status}">${pillText}</span>
    </div>`;
  }).join('');
  $('res-list').querySelectorAll('.res-item').forEach(el => el.onclick = () => {
    S.i = parseInt(el.dataset.idx);
    $('view-results').classList.add('hide');
    $('view-test').classList.remove('hide');
    loadQuestion();
  });
}

$('res-home').onclick = showHome;
$('res-retry-wrong').onclick = () => {
  const ids = new Set([...(S.wrongIds||[]), ...(S.untriedIds||[])]);
  const items = QS.filter(q => ids.has(q.id));
  if (items.length) start(items);
};
function showHome() {
  stopTimer();
  S = null;
  $('view-test').classList.add('hide');
  $('view-results').classList.add('hide');
  $('view-home').classList.remove('hide');
  const dp = $('desmos-panel'); if (dp) dp.remove();
  desmosOpen = false;
  $('work').classList.remove('desmos-shift');
  load();
}

// ---- AI Tutor Chat ----
(function(){
  const st = document.createElement('style');
  st.textContent = `
  #ai-panel{position:fixed;right:22px;bottom:74px;z-index:9001;width:min(400px,calc(100vw - 32px));height:min(520px,70vh);
    background:var(--panel);border:1px solid var(--border);border-radius:16px;display:none;
    flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden}
  #ai-panel.open{display:flex}
  #ai-head{padding:14px 18px;background:#8b5cf6;color:#fff;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  #ai-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
  #ai-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .ai-msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .ai-msg.user{align-self:flex-end;background:var(--blue-bg);color:var(--text)}
  .ai-msg.bot{align-self:flex-start;background:var(--bg);color:var(--text)}
  #ai-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
  #ai-in{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--panel);color:var(--text)}
  #ai-send{background:#8b5cf6;color:#fff;border:none;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}`;
  document.head.appendChild(st);

  const panel = document.createElement('div');
  panel.id = 'ai-panel';
  panel.innerHTML = `
    <div id="ai-head"><span>AI Tutor ✦</span><button id="ai-close">✕</button></div>
    <div id="ai-msgs"></div>
    <form id="ai-form"><input id="ai-in" placeholder="Ask about this question..." autocomplete="off"><button id="ai-send">Send</button></form>`;
  document.body.appendChild(panel);

  $('btn-ai').onclick = () => panel.classList.toggle('open');
  panel.querySelector('#ai-close').onclick = () => panel.classList.remove('open');

  const msgs = panel.querySelector('#ai-msgs');
  function add(role, text) {
    const d = document.createElement('div');
    d.className = 'ai-msg ' + role;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  let history = [];

  panel.querySelector('#ai-form').onsubmit = async (e) => {
    e.preventDefault();
    const input = panel.querySelector('#ai-in');
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    add('user', q);

    let context = '';
    try {
      const cq = (typeof curQ === 'function') ? curQ() : null;
      if (cq) {
        const strip = h => (h||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
        context = `The student is working on this question.\nSection: ${cq.section} | Domain: ${cq.domain} | Skill: ${cq.skill} | Difficulty: ${cq.difficulty}\nQuestion: ${strip(cq.stem_html).slice(0,2000)}${cq.stem_text ? '\nText: ' + cq.stem_text.slice(0,2000) : ''}\nChoices: ${(cq.choices||[]).map(c => (c.letter||'') + ': ' + strip(c.content)).join(' | ')}`;
      }
    } catch(_) {}

    history.push({role:'user', content: q});
    const sysMsgs = [
      {role:'system', content:'You are an SAT tutor. Guide the student to understand — never just hand over the answer unless they explicitly ask for it or have already attempted it. Be concise.'}
    ];
    if (context) sysMsgs.push({role:'system', content: context});
    if (history.length > 12) history = history.slice(-12);

    add('bot', '…');
    try {
      const r = await fetch('/api/chat', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ messages: [...sysMsgs, ...history] })
      });
      const data = await r.json();
      msgs.lastChild.remove();
      const reply = data.reply || ('Error: ' + (data.error || r.status));
      add('bot', reply);
      if (data.reply) history.push({role:'assistant', content: data.reply});
    } catch(err) {
      msgs.lastChild.remove();
      add('bot', 'Network error: ' + err.message);
    }
  };
})();

// ---------------- auth (Supabase) ----------------
let sb = null, uid = null;
const $authBtn = $('btn-auth'), $userName = $('user-name');
function sbHeaders() { return uid ? { 'X-User-Id': uid } : {}; }
async function initAuth() {
  try {
    sb = window.supabase.createClient('https://lbwxzcdmhyhgtscthnaq.supabase.co', 'sb_publishable_jG8GJoT0puI7Roflw6yiFQ_IL7lSifr');
  } catch (e) { console.warn('supabase client failed', e); return; }
  const { data: { session } } = await sb.auth.getSession();
  applySession(session);
  $authBtn.onclick = async () => {
    if (sb.auth.getSession) {
      const { data } = await sb.auth.getSession();
      if (data.session) { await sb.auth.signOut(); applySession(null); }
      else await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/auth/callback' } });
    }
  };
  sb.auth.onAuthStateChange((_e, s) => applySession(s));
}
function applySession(session) {
  uid = session?.user?.id || null;
  const u = session?.user;
  const n = u?.user_metadata?.full_name || u?.email || '';
  $userName.textContent = n;
  $userName.style.display = u ? '' : 'none';
  $authBtn.textContent = u ? 'Sign out' : 'Sign in with Google';
}
initAuth();

// go
load();
})();
