<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Help Me Ace It</title>
<style>
/* The tokens the app uses, cut down to the ones this page paints with. No webfont
   and no CDN: a 404 that has to fetch anything is a 404 that renders twice. */
:root {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --border: #e5e7eb;
  --text: #111827; --dim: #6b7280; --blue: #2563eb; --blue-dark: #1d4ed8;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1115; --panel: #181b21; --border: #2a2e37;
  --text: #e5e7eb; --dim: #9ca3af; --blue: #3b82f6; --blue-dark: #60a5fa;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: var(--bg); color: var(--text);
  font-family: Roboto, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
.card {
  width: 100%; max-width: 440px; padding: 40px 32px; text-align: center;
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
}
.code { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -1px; color: var(--blue); }
h1 { margin: 16px 0 8px; font-size: 22px; font-weight: 600; }
p { margin: 0 0 24px; font-size: 15px; line-height: 1.55; color: var(--dim); }
a.home {
  display: inline-block; padding: 11px 22px; border-radius: 10px;
  background: var(--blue); color: #fff; font-size: 15px; font-weight: 500; text-decoration: none;
}
a.home:hover { background: var(--blue-dark); }
.path {
  margin-top: 20px; font-size: 12.5px; color: var(--dim);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  word-break: break-all;
}
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>That address isn't part of the question bank. It may have moved, or the link may be wrong.</p>
    <a class="home" href="/">Back to the dashboard</a>
    <div class="path" id="path"></div>
  </div>
<script>
// Same key and shape the app stores its settings under, so a reader who picked
// dark mode does not get a white flash on the way to a 404.
try {
  var s = JSON.parse(localStorage.getItem('satq_settings') || '{}');
  var t = s.theme === 'light' || s.theme === 'dark' ? s.theme
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
} catch (e) {}
document.getElementById('path').textContent = location.pathname;
</script>
</body>
</html>
